<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Diploma - Test Application</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: #ffffff;
            background: linear-gradient(135deg, #172554, #1e40af, #2563eb);
        }

        .container {
            max-width: 700px;
            margin: 24px;
            padding: 48px;
            text-align: center;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin-bottom: 16px;
            font-size: 32px;
        }

        p {
            color: #dbeafe;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            margin-top: 24px;
            padding: 10px 20px;
            color: #dcfce7;
            background: rgba(22, 163, 74, 0.25);
            border: 1px solid #4ade80;
            border-radius: 30px;
        }

        .version {
            margin-top: 32px;
            font-size: 13px;
            color: #bfdbfe;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Netology DevOps Diploma</h1>
        <p>Тестовое веб-приложение для демонстрации CI/CD и Kubernetes.</p>
        <p>Application runs on Nginx in a Docker container.</p>
        <div class="status">● Application is running</div>
        <div class="version">Version 1.1.0 | CI/CD Auto Deployment</div>
    </main>
</body>
</html>
