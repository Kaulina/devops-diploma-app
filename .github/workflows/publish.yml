name: Build, publish and deploy Docker image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-diploma-app:${{ github.sha }} .

      - name: Login to Yandex Container Registry
        if: github.event_name == 'push'
        env:
          YC_SERVICE_ACCOUNT_KEY: ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}
        run: printf '%s' "$YC_SERVICE_ACCOUNT_KEY" | docker login --username json_key --password-stdin cr.yandex

      - name: Push Docker image
        if: github.event_name == 'push'
        env:
          REGISTRY_ID: crp7gjifsd8kne87344g
        run: |
          IMAGE="cr.yandex/${REGISTRY_ID}/devops-diploma-app"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          docker tag "devops-diploma-app:${GITHUB_SHA}" "$IMAGE:${SHORT_SHA}"
          docker tag "devops-diploma-app:${GITHUB_SHA}" "$IMAGE:latest"

          docker push "$IMAGE:${SHORT_SHA}"
          docker push "$IMAGE:latest"

      - name: Deploy to Kubernetes
        if: github.event_name == 'push'
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: 51.250.12.21
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          IMAGE="cr.yandex/crp7gjifsd8kne87344g/devops-diploma-app"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            ubuntu@"$DEPLOY_HOST" \
            "kubectl set image deployment/devops-diploma-app devops-diploma-app=$IMAGE:$SHORT_SHA && kubectl rollout status deployment/devops-diploma-app --timeout=180s"